services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: currency
      POSTGRES_USER: currency
      POSTGRES_PASSWORD: currency
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U currency -d currency"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      # .env's DATABASE_URL is host-oriented (127.0.0.1:5433, for running
      # uvicorn directly on the host). Inside this container, the DB is
      # reachable at the "postgres" service name on its internal port —
      # this override takes precedence over env_file for the same key.
      DATABASE_URL: postgresql+asyncpg://currency:currency@postgres:5432/currency
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
